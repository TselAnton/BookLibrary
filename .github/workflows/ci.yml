name: Build and test

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: windows-2022
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-java@v6.1.0
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: maven
            - name: Build and run isolated tests
              run: mvn --batch-mode --no-transfer-progress clean verify
